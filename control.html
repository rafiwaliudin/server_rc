<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Autopia Web Controller</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap');

        :root {
            --accent: #00ffcc;
            --accent-red: #ff3366;
            --bg-glass: rgba(10, 15, 25, 0.6);
            --border-glass: rgba(0, 255, 204, 0.3);
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111; /* Dark background instead of pure black for better contrast with UI */
            background-image: radial-gradient(circle at center, #222 0%, #000 100%); /* Add a subtle gradient */
            font-family: 'Rajdhani', sans-serif;
            color: var(--text-main);
        }

        /* Scanline Overlay for Cyberpunk Feel */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0) 50%, rgba(0, 0, 0, 0.1) 50%, rgba(0, 0, 0, 0.1));
            background-size: 100% 4px;
            z-index: 2;
            pointer-events: none;
            animation: scanline-scroll 10s linear infinite;
        }

        @keyframes scanline-scroll {
            0% { background-position: 0 0; }
            100% { background-position: 0 100vh; }
        }

        /* UI Container */
        .ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
            /* Let clicks pass through to joysticks */
        }

        /* Top HUD */
        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: auto;
        }

        .hud-panel {
            background: rgba(15, 20, 25, 0.85);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .hud-panel.hud-left {
            clip-path: polygon(0 0, 100% 0, 85% 100%, 0% 100%);
            border-bottom: 2px solid var(--accent);
            padding: 10px 40px 10px 20px;
        }

        .hud-panel.hud-right {
            clip-path: polygon(0 0, 100% 0, 100% 100%, 15% 100%);
            border-bottom: 2px solid var(--accent);
            padding: 10px 20px 10px 40px;
        }

        .hud-left {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent);
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        .status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            color: var(--text-muted);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff3366;
            box-shadow: 0 0 10px #ff3366;
            transition: all 0.3s ease;
        }

        .status-dot.connected {
            background: #00ffcc;
            box-shadow: 0 0 10px #00ffcc;
        }

        .hud-middle {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.6));
            margin-top: -5px;
        }
        
        .shape-group-left, .shape-group-right {
            display: flex;
            gap: 8px;
            margin-top: 5px;
        }
        
        .shape-group-left {
            margin-right: -15px;
        }
        
        .shape-group-right {
            margin-left: -15px;
        }

        .stripe-shape {
            width: 15px;
            height: 35px;
            background: linear-gradient(to bottom, #dcdcdc, #666);
            border-bottom: 2px solid #333;
        }

        .shape-group-left .stripe-shape {
            transform: skewX(-25deg);
        }

        .shape-group-right .stripe-shape {
            transform: skewX(25deg);
        }

        .main-trapezoid {
            background: linear-gradient(to bottom, #f0f0f0, #999);
            padding: 20px 60px 10px 60px;
            clip-path: polygon(0 0, 100% 0, 85% 100%, 15% 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        .logo-img {
            height: 70px;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        .car-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-car {
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid var(--border-glass);
            color: var(--text-muted);
            width: 35px;
            height: 35px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 5px rgba(0,255,204,0.4); }
            50% { box-shadow: 0 0 15px rgba(0,255,204,0.8); }
            100% { box-shadow: 0 0 5px rgba(0,255,204,0.4); }
        }

        .btn-car.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            animation: pulse-glow 2s infinite;
        }

        .btn-car:hover:not(.active) {
            border-color: var(--accent);
            color: var(--accent);
        }
        
        .rc-panel-bottom {
            background: rgba(15, 20, 25, 0.85);
            backdrop-filter: blur(5px);
            border-top: 2px solid var(--accent);
            clip-path: polygon(10% 0, 90% 0, 100% 100%, 0% 100%);
            padding: 15px 50px 10px 50px;
            align-self: flex-end;
            margin-bottom: 0px;
            pointer-events: auto;
        }

        .hud-right {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .speed-label {
            font-size: 10px;
            letter-spacing: 1px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .speed-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-speed {
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid var(--accent);
            color: var(--accent);
            width: 30px;
            height: 30px;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-speed:active {
            background: var(--accent);
            color: #000;
            transform: scale(0.95);
        }

        .speed-value {
            font-family: 'Share Tech Mono', monospace;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
            min-width: 20px;
            text-align: center;
        }

        /* Joystick Zones */
        .joystick-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 20px 40px;
            flex: 1;
            position: relative;
        }

        .zone {
            width: 150px;
            height: 150px;
            position: relative;
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 50%;
            border: 2px dashed rgba(255, 255, 255, 0.1);
        }

        /* Arc Gauges (Throttle & Steering) */
        .gauge-container {
            position: absolute;
            bottom: 170px;
            width: 150px;
            height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            opacity: 0.9;
        }

        .gauge-left { left: 40px; }
        .gauge-right { right: 40px; }

        .gauge-svg {
            width: 120px;
            height: 120px;
        }

        .gauge-fill {
            transition: stroke-dashoffset 0.1s ease-out, stroke 0.2s;
        }

        .gauge-value {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -20%);
            font-family: 'Share Tech Mono', monospace;
            font-size: 32px;
            font-weight: bold;
            color: var(--text-muted);
            transition: color 0.2s;
        }

        .gauge-gear {
            position: absolute;
            bottom: 25px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 14px;
            font-weight: bold;
            color: var(--accent);
            text-shadow: 0 0 5px var(--accent);
            background: rgba(0,255,204,0.1);
            padding: 2px 10px;
            border-radius: 10px;
            border: 1px solid rgba(0,255,204,0.3);
            transition: all 0.2s;
        }

        /* Steering Wheel Animation */
        .steer-wheel-svg {
            width: 100px;
            height: 100px;
            transition: transform 0.1s ease-out, filter 0.2s;
        }

        .steer-val-text {
            font-family: 'Share Tech Mono', monospace;
            font-size: 16px;
            color: var(--text-muted);
            margin-top: -15px;
            font-weight: bold;
        }

        .zone-label {
            position: absolute;
            top: -30px;
            width: 100%;
            text-align: center;
            font-family: 'Share Tech Mono', monospace;
            font-size: 14px;
            color: var(--text-muted);
            letter-spacing: 2px;
        }

        /* Camera Panel */
        .cam-panel {
            position: absolute;
            bottom: 20px;
            left: 210px;
            width: 160px;
            background: rgba(8, 14, 24, 0.88);
            border: 1px solid rgba(0, 255, 204, 0.25);
            border-radius: 10px;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: auto;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        .cam-label {
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            letter-spacing: 2px;
            color: var(--accent);
            text-transform: uppercase;
            text-align: center;
        }

        .cam-input-row {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .cam-input {
            flex: 1;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(0,255,204,0.3);
            border-radius: 5px;
            color: #fff;
            font-family: 'Share Tech Mono', monospace;
            font-size: 13px;
            padding: 4px 6px;
            width: 100%;
            outline: none;
            text-align: center;
        }

        .cam-input::placeholder { color: #555; }

        .cam-btn-row {
            display: flex;
            gap: 5px;
        }

        .cam-btn {
            flex: 1;
            padding: 5px 4px;
            border-radius: 5px;
            border: 1px solid;
            font-family: 'Rajdhani', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .cam-btn.set {
            background: rgba(0,255,204,0.1);
            border-color: var(--accent);
            color: var(--accent);
        }

        .cam-btn.set:hover {
            background: rgba(0,255,204,0.25);
            box-shadow: 0 0 8px rgba(0,255,204,0.3);
        }

        .cam-btn.stop {
            background: rgba(255,51,102,0.1);
            border-color: var(--accent-red);
            color: var(--accent-red);
        }

        .cam-btn.stop:hover {
            background: rgba(255,51,102,0.25);
            box-shadow: 0 0 8px rgba(255,51,102,0.3);
        }

        .cam-status {
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            text-align: center;
            color: var(--text-muted);
            min-height: 14px;
            transition: color 0.3s;
        }

        .cam-preview {
            width: 100%;
            height: 80px;
            border-radius: 6px;
            border: 1px solid rgba(0,255,204,0.15);
            background: #000;
            object-fit: cover;
            display: none;
        }

        /* Nipple.js customizations overrides */
        .nipple .back {
            background: rgba(0, 255, 204, 0.1) !important;
            border: 1px solid rgba(0, 255, 204, 0.3);
            box-shadow: inset 0 0 20px rgba(0, 255, 204, 0.1);
        }

        .nipple .front {
            background: rgba(0, 255, 204, 0.8) !important;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.6) !important;
        }

        #zone_left .nipple .back {
            background: rgba(255, 51, 102, 0.1) !important;
            border: 1px solid rgba(255, 51, 102, 0.3);
            box-shadow: inset 0 0 20px rgba(255, 51, 102, 0.1);
        }

        #zone_left .nipple .front {
            background: rgba(255, 51, 102, 0.8) !important;
            box-shadow: 0 0 15px rgba(255, 51, 102, 0.6) !important;
        }
    </style>
</head>

<body>

    <div class="scanlines"></div>

    <div class="ui-container">
        <!-- Top HUD -->
        <div class="hud-top">
            <div class="hud-panel hud-left">
                <div class="title">RC Car Control</div>
                <div class="status">
                    <div id="ws-status" class="status-dot"></div>
                    <span id="ws-text">DISCONNECTED</span>
                </div>
            </div>

            <div class="hud-middle">
                <div class="shape-group-left">
                    <div class="stripe-shape"></div>
                    <div class="stripe-shape"></div>
                </div>
                
                <div class="main-trapezoid">
                    <img src="thumbnail.png" alt="Autopia Logo" class="logo-img">
                </div>
                
                <div class="shape-group-right">
                    <div class="stripe-shape"></div>
                    <div class="stripe-shape"></div>
                </div>
            </div>

            <div class="hud-panel hud-right">
                <div class="speed-label">SPEED LIMIT</div>
                <div class="speed-controls">
                    <div class="btn-speed" id="btn-speed-down">-</div>
                    <div class="speed-value" id="speed-display">5</div>
                    <div class="btn-speed" id="btn-speed-up">+</div>
                </div>
            </div>
        </div>

        <!-- Joystick Zones -->
        <div class="joystick-container">
            <!-- Throttle Arc Gauge -->
            <div class="gauge-container gauge-left">
                <svg class="gauge-svg" viewBox="0 0 100 100">
                    <path d="M 21.716 78.284 A 40 40 0 1 1 78.284 78.284" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="8" stroke-linecap="round" />
                    <path id="throttle-fill" d="M 21.716 78.284 A 40 40 0 1 1 78.284 78.284" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="188.5" stroke-dashoffset="188.5" class="gauge-fill" />
                </svg>
                <div class="gauge-value" id="throttle-val-text">0<span style="font-size:14px">%</span></div>
                <div class="gauge-gear" id="throttle-gear-text">SPD: 2</div>
            </div>

            <!-- Steering Wheel Gauge -->
            <div class="gauge-container gauge-right">
                <svg class="steer-wheel-svg" id="steer-wheel" viewBox="0 0 100 100">
                    <path d="M 20 70 C 10 50, 10 30, 30 20 L 70 20 C 90 30, 90 50, 80 70 L 60 70 L 50 55 L 40 70 Z" fill="rgba(0,255,204,0.1)" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" id="steer-wheel-path"/>
                    <circle cx="50" cy="50" r="8" fill="var(--accent)" id="steer-wheel-center"/>
                </svg>
                <div class="steer-val-text" id="steer-val-text">C</div>
            </div>

            <div id="zone_left" class="zone">
                <div class="zone-label">THROTTLE</div>
            </div>

            <!-- Camera Panel -->
            <div class="cam-panel">
                <div class="cam-label">📷 CAMERA</div>
                <div class="cam-input-row">
                    <input class="cam-input" id="cam-index" type="text" placeholder="0 / /dev/video0" value="0">
                </div>
                <div class="cam-btn-row">
                    <div class="cam-btn set" id="cam-btn-set" onclick="setCam()">SET</div>
                    <div class="cam-btn stop" id="cam-btn-stop" onclick="stopCam()">STOP</div>
                </div>
                <div class="cam-status" id="cam-status">—</div>
                <img class="cam-preview" id="cam-preview" src="" alt="cam">
            </div>

            <!-- Moved RC Selection to bottom center with new shape -->
            <div class="rc-panel-bottom">
                <div class="speed-label" style="text-align: center; margin-bottom: 8px; font-weight: bold; font-size: 14px;">SELECT RC</div>
                <div class="car-controls">
                    <div class="btn-car active" data-id="1">1</div>
                    <div class="btn-car" data-id="2">2</div>
                    <div class="btn-car" data-id="3">3</div>
                    <div class="btn-car" data-id="4">4</div>
                    <div class="btn-car" data-id="5">5</div>
                    <div class="btn-car" data-id="6">6</div>
                </div>
            </div>

            <div id="zone_right" class="zone">
                <div class="zone-label">STEERING</div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    <script>
        const wsUrl = `ws://${window.location.hostname}:8888`;
        let ws;
        let isConnected = false;
        let steerIndex = 0; // Default to car 0

        // Control State
        let currentSteer = 0.0;
        let currentThrottle = 0.0;
        let currentBrake = 0.0;
        let speedLimit = 5;
        let activeCarId = 1;

        // UI Elements
        const wsStatusDot = document.getElementById('ws-status');
        const wsStatusText = document.getElementById('ws-text');
        const speedDisplay = document.getElementById('speed-display');
        const carBtns = document.querySelectorAll('.btn-car');
        
        // Gauge Elements
        const throttleFill = document.getElementById('throttle-fill');
        const throttleText = document.getElementById('throttle-val-text');
        const throttleGearText = document.getElementById('throttle-gear-text');
        
        const steerWheel = document.getElementById('steer-wheel');
        const steerText = document.getElementById('steer-val-text');
        const steerWheelPath = document.getElementById('steer-wheel-path');
        const steerWheelCenter = document.getElementById('steer-wheel-center');

        // Connect WebSocket
        function connectWS() {
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                isConnected = true;
                wsStatusDot.classList.add('connected');
                wsStatusText.innerText = 'ONLINE';
                // Request config to sync speed
                ws.send(JSON.stringify({ type: 'get_config' }));

                // Force game_active to true so server forwards commands to ESP32
                ws.send(JSON.stringify({ type: 'set_game_state', steer_index: steerIndex, active: true }));
            };

            ws.onclose = () => {
                isConnected = false;
                wsStatusDot.classList.remove('connected');
                wsStatusText.innerText = 'RECONNECTING...';
                setTimeout(connectWS, 2000);
            };

            ws.onerror = (err) => {
                console.error("WS Error: ", err);
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'controller_data' && data.steer_index === steerIndex) {
                        if (data.data.speed_limit !== undefined) {
                            speedLimit = data.data.speed_limit;
                            updateSpeedDisplay();
                        }
                        if (data.data.active_car_id !== undefined && data.data.active_car_id !== activeCarId) {
                            activeCarId = data.data.active_car_id;
                            updateCarUI();
                        }
                    } else if (data.type === 'config') {
                        if (data.data && data.data.controller && data.data.controller.speed_limits) {
                            speedLimit = data.data.controller.speed_limits[steerIndex] || 5;
                            updateSpeedDisplay();
                        }
                        if (data.data && data.data.controller && data.data.controller.active_car_ids) {
                            activeCarId = data.data.controller.active_car_ids[steerIndex] || 1;
                            updateCarUI();
                        }
                    }
                } catch (e) { }
            };
        }

        connectWS();

        // ─── CAMERA CONTROLS ──────────────────────────────────
        const camVideoHost = `http://${location.hostname}:5000`;
        const camStatus = document.getElementById('cam-status');
        const camPreview = document.getElementById('cam-preview');

        function setCam() {
            const idx = document.getElementById('cam-index').value.trim();
            if (idx === '') return;

            camStatus.innerText = 'CONNECTING...';
            camStatus.style.color = '#ffd700';

            fetch(`${camVideoHost}/set_rtsp`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ steer_index: steerIndex, url: idx })
            })
            .then(r => r.json())
            .then(d => {
                if (d.status === 'ok') {
                    camStatus.innerText = 'ACTIVE';
                    camStatus.style.color = '#00ffcc';
                    // Show small preview
                    const previewUrl = `${camVideoHost}/video_feed/${steerIndex}?t=${Date.now()}`;
                    camPreview.src = previewUrl;
                    camPreview.style.display = 'block';
                    camPreview.onerror = () => {
                        camStatus.innerText = 'NO SIGNAL';
                        camStatus.style.color = '#ff3366';
                        camPreview.style.display = 'none';
                    };
                } else {
                    camStatus.innerText = 'ERROR';
                    camStatus.style.color = '#ff3366';
                }
            })
            .catch(() => {
                camStatus.innerText = 'FAILED';
                camStatus.style.color = '#ff3366';
            });
        }

        function stopCam() {
            fetch(`${camVideoHost}/set_rtsp`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ steer_index: steerIndex, url: '' })
            })
            .then(() => {
                camPreview.src = '';
                camPreview.style.display = 'none';
                camStatus.innerText = 'STOPPED';
                camStatus.style.color = '#8b9bb4';
            })
            .catch(() => {
                camStatus.innerText = 'ERROR';
                camStatus.style.color = '#ff3366';
            });
        }

        function updateCarUI() {
            carBtns.forEach(btn => {
                if (parseInt(btn.dataset.id) === activeCarId) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        // Car Selection Controls
        carBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const id = parseInt(btn.dataset.id);
                if (isConnected && id !== activeCarId) {
                    ws.send(JSON.stringify({
                        type: 'select_car',
                        steer_index: steerIndex,
                        car_id: id
                    }));
                    // UI will update when server broadcasts the change
                }
            });
        });

        // Speed Limit Controls
        document.getElementById('btn-speed-up').addEventListener('click', () => {
            if (isConnected && speedLimit < 5) {
                speedLimit++;
                ws.send(JSON.stringify({ type: 'set_speed_limit', steer_index: steerIndex, limit: speedLimit }));
                updateSpeedDisplay();
            }
        });

        document.getElementById('btn-speed-down').addEventListener('click', () => {
            if (isConnected && speedLimit > 0) {
                speedLimit--;
                ws.send(JSON.stringify({ type: 'set_speed_limit', steer_index: steerIndex, limit: speedLimit }));
                updateSpeedDisplay();
            }
        });

        function updateSpeedDisplay() {
            if (speedLimit === 0) {
                speedDisplay.innerText = 'N';
                speedDisplay.style.color = '#ff3366';
                throttleGearText.innerText = 'GEAR N';
                throttleGearText.style.color = '#ff3366';
                throttleGearText.style.borderColor = 'rgba(255, 51, 102, 0.3)';
                throttleGearText.style.background = 'rgba(255, 51, 102, 0.1)';
                throttleGearText.style.textShadow = '0 0 5px #ff3366';
            } else {
                speedDisplay.innerText = speedLimit;
                speedDisplay.style.color = '#fff';
                throttleGearText.innerText = `SPD: ${speedLimit}`;
                throttleGearText.style.color = '#00ffcc';
                throttleGearText.style.borderColor = 'rgba(0, 255, 204, 0.3)';
                throttleGearText.style.background = 'rgba(0, 255, 204, 0.1)';
                throttleGearText.style.textShadow = '0 0 5px #00ffcc';
            }
        }

        // Initialize Joysticks
        const zoneLeft = document.getElementById('zone_left');
        const zoneRight = document.getElementById('zone_right');

        // Left Joystick (Throttle/Brake) - Vertical Only
        const joyLeft = nipplejs.create({
            zone: zoneLeft,
            mode: 'static',
            position: { left: '50%', top: '50%' },
            color: '#ff3366',
            lockY: true, // Lock to Y axis
            size: 120
        });

        // Right Joystick (Steering) - Horizontal Only
        const joyRight = nipplejs.create({
            zone: zoneRight,
            mode: 'static',
            position: { left: '50%', top: '50%' },
            color: '#00ffcc',
            lockX: true, // Lock to X axis
            size: 120
        });

        joyRight.on('move', (evt, data) => {
            // Distance max is size/2 = 60. Normalize to -1.0 to 1.0
            const maxDist = 60;
            const dist = Math.min(data.distance, maxDist);
            const angle = data.angle.radian;

            // For lockX, cos(angle) determines direction. Right is 0, Left is PI.
            let x = (dist / maxDist) * Math.cos(angle);
            // x is positive right, negative left. In server, max angle is 90.
            currentSteer = x;
            updateSteeringGauge();
        });

        joyRight.on('end', () => {
            currentSteer = 0.0;
            updateSteeringGauge();
        });

        function updateSpeedometer() {
            let percentage = 0;
            if (currentThrottle > 0) {
                percentage = Math.round(currentThrottle * 100);
                throttleText.innerHTML = `${percentage}<span style="font-size:14px">%</span>`;
                throttleText.style.color = '#00ffcc';
                throttleText.style.textShadow = '0 0 10px #00ffcc';
                throttleFill.style.stroke = '#00ffcc';
                throttleFill.style.strokeDashoffset = 188.5 - (188.5 * percentage / 100);
                throttleFill.style.filter = 'drop-shadow(0 0 5px #00ffcc)';
            } else if (currentBrake > 0) {
                percentage = Math.round(currentBrake * 100);
                throttleText.innerHTML = `${percentage}<span style="font-size:14px">%</span>`;
                throttleText.style.color = '#ff3366';
                throttleText.style.textShadow = '0 0 10px #ff3366';
                throttleFill.style.stroke = '#ff3366';
                throttleFill.style.strokeDashoffset = 188.5 - (188.5 * percentage / 100);
                throttleFill.style.filter = 'drop-shadow(0 0 5px #ff3366)';
            } else {
                throttleText.innerHTML = `0<span style="font-size:14px">%</span>`;
                throttleText.style.color = '#8b9bb4';
                throttleText.style.textShadow = 'none';
                throttleFill.style.strokeDashoffset = 188.5;
                throttleFill.style.filter = 'none';
            }
        }

        function updateSteeringGauge() {
            const angle = currentSteer * 90; // max 90 deg rotation
            steerWheel.style.transform = `rotate(${angle}deg)`;
            
            if (currentSteer < 0) {
                steerText.innerText = `L ${Math.round(Math.abs(currentSteer) * 100)}`;
                steerText.style.color = '#00ffcc';
                steerText.style.textShadow = '0 0 10px #00ffcc';
                steerWheel.style.filter = 'drop-shadow(0 0 5px #00ffcc)';
                steerWheelPath.style.stroke = '#00ffcc';
                steerWheelCenter.style.fill = '#00ffcc';
            } else if (currentSteer > 0) {
                steerText.innerText = `R ${Math.round(currentSteer * 100)}`;
                steerText.style.color = '#00ffcc';
                steerText.style.textShadow = '0 0 10px #00ffcc';
                steerWheel.style.filter = 'drop-shadow(0 0 5px #00ffcc)';
                steerWheelPath.style.stroke = '#00ffcc';
                steerWheelCenter.style.fill = '#00ffcc';
            } else {
                steerText.innerText = 'C';
                steerText.style.color = '#8b9bb4';
                steerText.style.textShadow = 'none';
                steerWheel.style.filter = 'none';
                steerWheelPath.style.stroke = '#00ffcc';
                steerWheelCenter.style.fill = '#00ffcc';
            }
        }

        joyLeft.on('move', (evt, data) => {
            const maxDist = 60;
            const dist = Math.min(data.distance, maxDist);
            const angle = data.angle.radian;
            
            // For lockY, sin(angle) determines direction. Up is PI/2, Down is 3PI/2.
            let y = (dist / maxDist) * Math.sin(angle);
            
            // y is positive UP, negative DOWN
            if (y > 0) {
                currentThrottle = y;
                currentBrake = 0.0;
            } else {
                currentThrottle = 0.0;
                currentBrake = Math.abs(y);
            }
            updateSpeedometer();
        });

        joyLeft.on('end', () => {
            currentThrottle = 0.0;
            currentBrake = 0.0;
            updateSpeedometer();
        });

        // Control Loop - Send Data at 20Hz (every 50ms)
        setInterval(() => {
            if (!isConnected) return;

            let dir = "CENTER";
            if (currentSteer > 0.05) dir = "RIGHT";
            else if (currentSteer < -0.05) dir = "LEFT";

            ws.send(JSON.stringify({
                type: 'web_control',
                steer_index: steerIndex,
                steering_angle: currentSteer * 90.0,   // convert -1..1 → -90..90 degrees
                steering_direction: dir,
                steering_raw: currentSteer,             // normalized -1..1
                throttle: currentThrottle,
                brake: currentBrake
            }));

        }, 50);

    </script>
</body>

</html>
